application:
  name: airflow
  pods:
  - name: app
    image: registry.nexlayer.io/user_01kece1xyh817dwff7wnarhkxd/airflow:19f15a78c94
    path: /
    servicePorts:
    - 8080
    vars:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-postgres.pod:5432/airflow"
  - name: airflow-postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
